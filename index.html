<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inicio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Mi archivo CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- Barra de navegacion -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">
                Mi sitio
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="menu">

                <div class="navbar-nav">

                    <a class="nav-link active"
                       href="index.html">
                        Inicio
                    </a>

                    <a class="nav-link"
                       href="tags.html">
                        Etiquetas
                    </a>

                    <a class="nav-link"
                       href="profile.html">
                        Perfil
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- Formulario -->

    <div class="container">

        <div class="login">

            <h1>Inicio de sesión</h1>

            <p class="texto-destacado">
                Ingresa tus datos para iniciar sesión.
            </p>

            <form>

                <div class="mb-3">

                    <label for="usuario"
                           class="form-label">
                        Usuario
                    </label>

                    <input type="text"
                           class="form-control"
                           id="usuario"
                           name="usuario">

                </div>

                <div class="mb-3">

                    <label for="password"
                           class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password">

                </div>

                <button type="submit"
                        class="btn btn-primary">

                    Iniciar sesión

                </button>

            </form>

        </div>

    </div>


    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
